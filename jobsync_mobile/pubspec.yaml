name: jobsync_mobile
description: JobSync - Job Application Tracking System

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Authentication
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.2.1
  url_launcher: ^6.2.4

  # File Picking
  file_picker: ^6.1.1
  googleapis: ^12.0.0
  http: ^1.2.0

  # Payment
  flutter_stripe: ^11.0.0

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Navigation
  go_router: ^12.1.1

  # Utils
  intl: ^0.19.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.5
  mocktail: ^1.0.0

flutter:
  uses-material-design: true